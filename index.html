<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>پورتفولیو و رزومه ذبیح‌الله اسحاقی</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f7f6; color: #333; text-align: center; padding: 50px; }
        .card { background: white; max-width: 500px; margin: 0 auto; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #24292e; }
        p { font-size: 18px; line-height: 1.6; }
        .btn { display: inline-block; padding: 10px 20px; background-color: #2ea44f; color: white; text-decoration: none; border-radius: 5px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>به وب‌سایت رسمی من خوش آمدید</h1>
        <p>من ذبیح‌الله اسحاقی هستم. این سایت به صورت کاملاً رایگان روی سرورهای ابری گیت‌هاب میزبانی می‌شود.</p>
        <a href="#" class="btn">مشاهده نمونه کارها</a>
    </div>
</body>
</html>
